name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main, release/KAN-55]
  pull_request:
    branches: [main, release/KAN-55]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 커밋 해시 추출
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 4: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Chmod gradlew
        run: chmod +x gradlew

      # Step 5: 테스트 실행
#      - name: Run tests
#        run: ./gradlew test

      # Step 6: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 7: docker hub 자격증명
      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 8: Docker 빌드 및 push
      - name: Build and push docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tixy:arm64

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # main push에서만 배포 (PR에서는 CI만 실행)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT1 }}
          script: |
            sudo docker stop tixy || true
            sudo docker rm tixy || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tixy:arm64
            sudo docker run -d --name tixy \
            -p 8080:8080 \
            ${{ secrets.DOCKERHUB_USERNAME }}/tixy:arm64 \
            --spring.profiles.active=prod